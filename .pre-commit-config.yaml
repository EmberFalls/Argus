repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.5.3
    hooks:
      - id: prettier

  - repo: local
    hooks:
      - id: generated-contracts-current
        name: Check generated JSON schemas and TypeScript contracts
        entry: python scripts/generate_schemas.py --check
        language: system
        pass_filenames: false
        files: ^(packages/shared/src/argus_contracts/|packages/shared/schemas/|packages/ui/lib/generated/contracts\.ts|scripts/generate_schemas\.py)
