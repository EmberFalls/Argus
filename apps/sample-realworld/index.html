<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench — stories for curious people</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#24303a;background:#f7f8f6;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}
    header{height:68px;background:#fff;border-bottom:1px solid #e8ebe8;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1080px)/2),24px)}
    .brand{font-family:Georgia,serif;font-weight:700;font-size:25px;color:#25866b;text-decoration:none;letter-spacing:-1px}.nav{display:flex;align-items:center;gap:22px}.nav button,.nav a{background:none;border:0;color:#78827e;text-decoration:none;font-size:14px}.nav .active{color:#25866b}
    .hero{background:#25866b;color:#fff;text-align:center;padding:44px 20px 40px}.hero h1{font:700 48px Georgia,serif;margin:0 0 10px;letter-spacing:-1.4px}.hero p{margin:0;color:#d7efe7;font-size:17px}
    main{max-width:1080px;margin:34px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:44px}.tabs{display:flex;gap:22px;border-bottom:1px solid #dde2de;margin-bottom:20px}.tabs button{border:0;background:none;padding:0 0 12px;color:#79837e}.tabs button.active{color:#25866b;border-bottom:2px solid #25866b}
    .story{padding:18px 0 21px;border-bottom:1px solid #e4e8e5}.byline{color:#81908a;font-size:12px;margin-bottom:9px}.story h2{font:700 22px Georgia,serif;margin:0 0 6px;color:#303b36}.story p{color:#87918d;margin:0 0 12px;font-size:14px}.story-foot{display:flex;align-items:center;justify-content:space-between;color:#929b96;font-size:12px}.favorite{color:#25866b;border:1px solid #a6cfc1;background:#fff;border-radius:4px;padding:4px 8px}.topic-list{display:flex;gap:5px;flex-wrap:wrap}.topic{background:#eef2ef;padding:3px 8px;border-radius:15px;color:#77817c}.side{background:#edf2ee;padding:17px;border-radius:5px;height:max-content}.side h3{font-size:14px;margin:0 0 12px}.side p{font-size:13px;color:#68746e;line-height:1.5;margin:0}.topic-button{border:0;background:#dce6df;color:#506058;padding:5px 9px;margin:0 4px 6px 0;border-radius:15px;font-size:12px}
    dialog{border:0;border-radius:8px;box-shadow:0 15px 60px #15251f44;width:min(460px,calc(100% - 32px));padding:25px}dialog::backdrop{background:#15251f77}dialog h2{font:700 25px Georgia,serif;margin:0 0 18px}label{display:block;font-size:13px;color:#68746e;margin:12px 0 5px}input,textarea{width:100%;padding:10px;border:1px solid #dce2dd;border-radius:4px}textarea{min-height:88px;resize:vertical}.primary{background:#25866b;color:white;border:0;padding:10px 16px;border-radius:4px;margin-top:15px}.close{float:right;border:0;background:none;font-size:22px;color:#89928d}.message{padding:10px;background:#fff1dc;color:#72501b;margin:0 0 12px;border-radius:4px}.demo{background:#fff1dc;color:#72501b;text-align:center;padding:9px;font-size:13px}
    @media(max-width:740px){main{grid-template-columns:1fr;gap:22px}.hero h1{font-size:39px}.side{order:-1}header{padding:0 18px}.nav{gap:11px}}
  </style>
</head>
<body>
  <header><a class="brand" href="/">Workbench</a><nav class="nav"><button id="write-link">Write a story</button><button id="login-link">Sign in</button></nav></header>
  <div id="demo-banner"></div>
  <section class="hero"><h1>Workbench</h1><p>A gathering place for curious people</p></section>
  <main><section><div class="tabs"><button class="active" data-filter="">Latest stories</button><button data-filter="welcome">Welcome</button></div><div id="stories" aria-live="polite"></div></section>
    <aside class="side"><h3>Topics to explore</h3><div id="topics"></div><p>Find a thread that interests you and follow it somewhere new.</p></aside></main>
  <dialog id="login-dialog"><button class="close" data-close aria-label="Close">×</button><h2>Sign in</h2><div class="message" hidden></div><form id="login-form"><label for="username">Display name</label><input id="username" required autocomplete="username"><button class="primary">Continue</button></form></dialog>
  <dialog id="story-dialog"><button class="close" data-close aria-label="Close">×</button><h2>Write a story</h2><div class="message" hidden></div><form id="story-form"><label for="title">Title</label><input id="title" required><label for="description">Short description</label><input id="description"><label for="body">Your story</label><textarea id="body"></textarea><label for="story-topics">Topics, separated by commas</label><input id="story-topics"><button class="primary">Publish story</button></form></dialog>
  <script>
    const storiesEl=document.querySelector('#stories'),topicsEl=document.querySelector('#topics');let filter='';
    async function loadStories(){const data=await fetch('/api/stories'+(filter?'?topic='+encodeURIComponent(filter):'')).then(r=>r.json());document.querySelector('#demo-banner').innerHTML=data.demoMode?'<div class="demo">Demo defect flags are enabled. Some story actions may behave unexpectedly.</div>':'';storiesEl.replaceChildren();data.stories.forEach(story=>{const card=document.createElement('article');card.className='story';const author=document.createElement('div');author.className='byline';author.textContent='✦ '+story.author+' · just now';const title=document.createElement('h2');title.textContent=story.title;const desc=document.createElement('p');desc.textContent=story.description;const foot=document.createElement('div');foot.className='story-foot';const tags=document.createElement('div');tags.className='topic-list';story.tagList.forEach(t=>{const tag=document.createElement('span');tag.className='topic';tag.textContent=t;tags.append(tag)});const fav=document.createElement('button');fav.className='favorite';fav.textContent='♥ '+story.favoritesCount;fav.setAttribute('aria-label','Favorite '+story.title);fav.onclick=async()=>{await fetch('/api/stories/'+encodeURIComponent(story.slug)+'/favorite',{method:'POST'});loadStories()};foot.append(tags,fav);card.append(author,title,desc,foot);storiesEl.append(card)})}
    async function loadTopics(){const data=await fetch('/api/topics').then(r=>r.json());topicsEl.replaceChildren();data.topics.forEach(t=>{const b=document.createElement('button');b.className='topic-button';b.textContent=t;b.onclick=()=>{filter=t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));loadStories()};topicsEl.append(b)})}
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));loadStories()});
    const login=document.querySelector('#login-dialog'),storyDialog=document.querySelector('#story-dialog');document.querySelector('#login-link').onclick=()=>login.showModal();document.querySelector('#write-link').onclick=()=>storyDialog.showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
    document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();const res=await fetch('/api/auth/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value})});if(res.ok){login.close();document.querySelector('#login-link').textContent='Signed in';}else login.querySelector('.message').hidden=false};
    document.querySelector('#story-form').onsubmit=async e=>{e.preventDefault();const value=id=>document.querySelector('#'+id).value;const res=await fetch('/api/stories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:value('title'),description:value('description'),body:value('body'),topics:value('story-topics')})});if(res.ok){storyDialog.close();e.target.reset();filter='';loadStories();loadTopics()}else storyDialog.querySelector('.message').hidden=false};
    loadStories();loadTopics();
  </script>
</body>
</html>
