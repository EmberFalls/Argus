  <text x="1000" y="31" fill="#69736d" font-family="Arial,sans-serif" font-size="14">Home</text>
  <text x="1064" y="31" fill="#69736d" font-family="Arial,sans-serif" font-size="14">Sign in</text>
  <rect y="52" width="1280" height="184" fill="#5ca582"/>
  <text x="640" y="132" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="52">conduit</text>
  <text x="640" y="174" text-anchor="middle" fill="#eef8f1" font-family="Arial,sans-serif" font-size="20">A place to share your knowledge.</text>
