<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Argus sample browser frame</title>
  <desc id="desc">A static sample page frame used during fixture replay.</desc>
  <rect width="1280" height="720" fill="#f7f8f6"/>
  <rect width="1280" height="52" fill="#fff"/>
