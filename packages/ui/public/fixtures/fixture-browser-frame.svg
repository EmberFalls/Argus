    <circle cx="205" cy="346" r="18" fill="#a7c6b5"/><text x="238" y="343" fill="#5ca582" font-size="13">Demo Author</text><text x="238" y="361" fill="#a0a7a2" font-size="11">October 15, 2026</text>
    <text x="185" y="405" fill="#344039" font-size="23" font-weight="700">A sample article for fixture replay</text>
    <text x="185" y="435" fill="#758079" font-size="14">This static frame lets panel work be previewed without launching a target site.</text>
    <text x="185" y="459" fill="#758079" font-size="14">Live runs replace this illustration with the Chromium screencast.</text>
