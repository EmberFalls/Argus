name: Deterministic demo
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Locally hosted sample app URL reachable by the runner
        required: true
        type: string
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "packages/agent[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: argus run --url "${{ inputs.target_url }}" --spec "Run the deterministic sample-app smoke exploration" --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: argus-evidence
          path: artifacts/
